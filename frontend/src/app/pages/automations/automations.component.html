<div class="page">
  <header>
    <h1>Automatizaciones</h1>
    <p>Notifica a las partes interesadas cuando se dispara un plan de contingencia.</p>
  </header>

  <article class="glass card">
    <h2>Correo de riesgo crítico</h2>
    <p>
      Asunto: <span class="mono">SUPPLYSAFE - Riesgo crítico en cadena de suministro</span><br />
      Destinatarios: Operaciones / Compras
    </p>
    <button type="button" class="btn" [disabled]="sending" (click)="sendDemoEmail()">
      {{ sending ? 'ENVIANDO…' : 'ENVIAR CORREO DEMO' }}
    </button>
    @if (lastMessage) {
      <p class="result mono">{{ lastMessage }}</p>
    }
  </article>
</div>
